<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeltaForge AI</title>
<style>
  :root {
    --accent: #6366F1;
    --accent-soft: #6366F133;
    --bg-deep: #0a0c0e;
    --panel: rgba(18, 24, 27, 0.85);
    --border: rgba(255, 255, 255, 0.08);
    --text-main: #e6e9eb;
    --text-muted: #8b959a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at 15% 10%, var(--accent-soft), transparent 40%),
      radial-gradient(circle at 85% 90%, var(--accent-soft), transparent 45%),
      linear-gradient(160deg, #0b0e10 0%, #05070a 60%, #030405 100%);
    color: var(--text-main);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .app-window {
    width: 100%;
    max-width: 920px;
    height: min(860px, 92vh);
    background: var(--panel);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55);
    position: relative;
  }

  /* ---------- Header ---------- */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .header-left { display: flex; align-items: center; gap: 12px; }

  .icon-box {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 60%, black));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 22px var(--accent-soft);
    flex-shrink: 0;
  }

  .icon-box svg { width: 24px; height: 24px; }

  .title-block .bot-title { font-size: 16px; font-weight: 700; letter-spacing: 0.2px; }
  .title-block .bot-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .header-right { display: flex; align-items: center; gap: 10px; }

  .status-pill {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: #86efac;
    background: rgba(34, 197, 94, 0.12);
    border: 1px solid rgba(34, 197, 94, 0.25);
    padding: 5px 10px; border-radius: 999px;
  }

  .status-pill .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 8px #22c55e;
    animation: pulse 1.6s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  .icon-btn {
    width: 32px; height: 32px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    color: var(--text-muted);
    cursor: pointer;
  }
  .icon-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.08); }
  .icon-btn svg { width: 16px; height: 16px; }

  /* ---------- Hero ---------- */
  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    text-align: center;
    gap: 18px;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  .hero.hidden { display: none; }

  .hero-emblem {
    width: 78px; height: 78px; border-radius: 22px;
    background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, black));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 40px var(--accent-soft);
  }
  .hero-emblem svg { width: 40px; height: 40px; }

  .hero h1 { font-size: 22px; font-weight: 700; }
  .hero p.hero-sub { font-size: 13.5px; color: var(--text-muted); max-width: 440px; }

  .pills {
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 6px;
  }

  .pill {
    font-size: 12.5px;
    padding: 9px 16px;
    border-radius: 999px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: var(--text-main);
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .pill:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
    transform: translateY(-1px);
  }

  /* ---------- Message stream ---------- */
  .stream {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: none;
    flex-direction: column;
    gap: 16px;
  }
  .stream.active { display: flex; }

  .msg { display: flex; gap: 10px; max-width: 82%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.assistant { align-self: flex-start; }

  .msg-badge {
    width: 28px; height: 28px; border-radius: 9px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, black));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 12px var(--accent-soft);
  }
  .msg-badge svg { width: 15px; height: 15px; }

  .msg-bubble {
    padding: 11px 15px;
    border-radius: 16px;
    font-size: 13.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user .msg-bubble {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-bottom-right-radius: 4px;
  }
  .msg.assistant .msg-bubble {
    background: rgba(255,255,255,0.035);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .typing-dots { display: flex; gap: 4px; padding: 4px 2px; }
  .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-muted);
    animation: bounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* ---------- Input bar ---------- */
  .input-bar-wrap { padding: 16px 20px 20px; flex-shrink: 0; }

  .input-capsule {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.045);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 8px 8px 16px;
  }

  .deco-icon { color: var(--text-muted); display: flex; flex-shrink: 0; }
  .deco-icon svg { width: 18px; height: 18px; }

  .input-capsule input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-main);
    font-size: 13.5px;
    padding: 8px 4px;
  }
  .input-capsule input::placeholder { color: var(--text-muted); }

  .send-btn {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 60%, black));
    border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 0 18px var(--accent-soft);
    flex-shrink: 0;
    transition: transform 0.1s ease;
  }
  .send-btn:hover { transform: scale(1.05); }
  .send-btn:active { transform: scale(0.95); }
  .send-btn svg { width: 17px; height: 17px; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 8px; }

  @media (max-width: 600px) {
    .app-window { height: 96vh; border-radius: 18px; }
    .hero h1 { font-size: 19px; }
  }
</style>
</head>
<body>

<div class="app-window">

  <div class="header">
    <div class="header-left">
      <div class="icon-box"><svg viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg"><text x="12" y="16" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="white">DF</text></svg></div>
      <div class="title-block">
        <div class="bot-title">DeltaForge AI</div>
        <div class="bot-subtitle">Black-Scholes-Merton, Volatility Surfaces & Exotics</div>
      </div>
    </div>
    <div class="header-right">
      <div class="status-pill"><span class="dot"></span> Online</div>
      <div class="icon-btn" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </div>
    </div>
  </div>

  <div class="hero" id="hero">
    <div class="hero-emblem"><svg viewBox="0 0 24 24" width="40" height="40" xmlns="http://www.w3.org/2000/svg"><text x="12" y="16" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="white">DF</text></svg></div>
    <h1>DeltaForge AI</h1>
    <p class="hero-sub">Black-Scholes-Merton, Volatility Surfaces & Exotics</p>
    <div class="pills">
      <div class="pill" data-prompt="Calculate Gamma squeeze exposure">Calculate Gamma squeeze exposure</div>
      <div class="pill" data-prompt="Construct local volatility smile">Construct local volatility smile</div>
      <div class="pill" data-prompt="Price barrier option knock-in">Price barrier option knock-in</div>
    </div>
  </div>

  <div class="stream" id="stream"></div>

  <div class="input-bar-wrap">
    <div class="input-capsule">
      <div class="deco-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
      </div>
      <input type="text" id="chat-input" placeholder="Ask DeltaForge AI about black-scholes-merton..." autocomplete="off" />
      <button class="send-btn" id="send-btn" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
  </div>

</div>

<script>
(function () {
  const hero = document.getElementById('hero');
  const stream = document.getElementById('stream');
  const input = document.getElementById('chat-input');
  const sendBtn = document.getElementById('send-btn');
  const pills = document.querySelectorAll('.pill');

  const ICON_SVG_SMALL = `<svg viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg"><text x="12" y="16" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="white">DF</text></svg>`;

  let history = [];
  let started = false;

  function activateChat() {
    if (started) return;
    started = true;
    hero.classList.add('hidden');
    stream.classList.add('active');
  }

  function scrollToBottom() {
    stream.scrollTop = stream.scrollHeight;
  }

  function addMessage(role, text) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;

    const badge = document.createElement('div');
    badge.className = 'msg-badge';
    badge.innerHTML = ICON_SVG_SMALL;

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;

    wrap.appendChild(badge);
    wrap.appendChild(bubble);
    stream.appendChild(wrap);
    scrollToBottom();
    return bubble;
  }

  function addTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'msg assistant';
    wrap.id = 'typing-indicator';

    const badge = document.createElement('div');
    badge.className = 'msg-badge';
    badge.innerHTML = ICON_SVG_SMALL;

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

    wrap.appendChild(badge);
    wrap.appendChild(bubble);
    stream.appendChild(wrap);
    scrollToBottom();
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  async function sendMessage(text) {
    const trimmed = (text || '').trim();
    if (!trimmed) return;

    activateChat();
    addMessage('user', trimmed);
    history.push({ role: 'user', text: trimmed });
    input.value = '';
    addTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: trimmed, history: history.slice(0, -1) })
      });
      const data = await res.json();
      removeTyping();
      const replyText = data.reply || 'No response received.';
      addMessage('assistant', replyText);
      history.push({ role: 'assistant', text: replyText });
    } catch (err) {
      removeTyping();
      addMessage('assistant', 'Connection error. Please check the server and try again.');
    }
  }

  sendBtn.addEventListener('click', () => sendMessage(input.value));
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage(input.value);
  });

  pills.forEach((pill) => {
    pill.addEventListener('click', () => {
      const prompt = pill.getAttribute('data-prompt');
      sendMessage(prompt);
    });
  });
})();
</script>

</body>
</html>
